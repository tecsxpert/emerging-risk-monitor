spring:
  application:
    name: emerging-risk-monitor

  datasource:
    url: jdbc:postgresql://localhost:5432/riskdb?serverTimezone=Asia/Kolkata
    username: riskuser
    password: riskpass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  #data:
   # redis:
     # host: localhost
      #port: 6379

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.internship.tool: DEBUG